<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sypher-mini Portal</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; max-width: 800px; margin: 0 auto; }
    h1 { font-size: 1.5rem; }
    section { margin: 1.5rem 0; }
    input, textarea, button { font: inherit; padding: 0.5rem; }
    textarea { width: 100%; min-height: 80px; }
    button { background: #333; color: #fff; border: none; cursor: pointer; }
    button:hover { background: #555; }
    .task { padding: 0.5rem; margin: 0.25rem 0; background: #f5f5f5; border-radius: 4px; }
    .task-id { font-family: monospace; font-size: 0.85rem; }
    code { background: #eee; padding: 0.1em 0.3em; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>Sypher-mini Portal</h1>
  <p>Your coding agent in your pocket—and on your desktop.</p>

  <section>
    <h2>New Task</h2>
    <textarea id="taskInput" placeholder="Ask the agent... e.g. What is 2+2?"></textarea>
    <button onclick="submitTask()">Submit</button>
    <p id="taskStatus"></p>
  </section>

  <section>
    <h2>Active Tasks</h2>
    <div id="tasks"></div>
  </section>

  <section>
    <h2>Config</h2>
    <p>API keys are configured via <code>~/.sypher-mini/config.json</code> or the CLI: <code>sypher config set providers.gemini.api_key YOUR_KEY</code></p>
  </section>

  <script>
    const base = window.location.origin;

    async function submitTask() {
      const input = document.getElementById('taskInput');
      const content = input.value.trim();
      if (!content) return;
      document.getElementById('taskStatus').textContent = 'Submitting...';
      try {
        const res = await fetch(base + '/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content })
        });
        const data = await res.json();
        document.getElementById('taskStatus').textContent = data.ok ? 'Task submitted. Check WhatsApp/Telegram for response.' : (data.error || 'Failed');
        input.value = '';
        loadTasks();
      } catch (e) {
        document.getElementById('taskStatus').textContent = 'Error: ' + e.message;
      }
    }

    async function loadTasks() {
      try {
        const res = await fetch(base + '/api/tasks');
        const data = await res.json();
        const div = document.getElementById('tasks');
        if (!data.tasks || data.tasks.length === 0) {
          div.innerHTML = '<p>No active tasks.</p>';
          return;
        }
        div.innerHTML = data.tasks.map(t => `
          <div class="task">
            <span class="task-id">${t.id}</span> — ${t.state}
            <button onclick="cancelTask('${t.id}')">Cancel</button>
          </div>
        `).join('');
      } catch (e) {
        document.getElementById('tasks').innerHTML = '<p>Failed to load tasks.</p>';
      }
    }

    async function cancelTask(id) {
      try {
        await fetch(base + '/api/tasks/' + id + '/cancel', { method: 'POST' });
        loadTasks();
      } catch (e) {}
    }

    loadTasks();
    setInterval(loadTasks, 5000);
  </script>
</body>
</html>
